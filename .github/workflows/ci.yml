name: HWA release checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: hwa-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  solidity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.7.1
      - name: Build deterministic reference union
        shell: pwsh
        run: ./scripts/BuildReferenceUnion.ps1
      - name: Format
        run: forge fmt --check
      - name: Build
        run: forge build
      - name: Test
        run: forge test -vv
      - name: Export compiled FWA ABI
        uses: actions/upload-artifact@v7
        with:
          name: hwa-fwa-abi-${{ github.sha }}
          path: out/FWA.sol/FWA.json
          if-no-files-found: error
          retention-days: 1

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: cp .env.example .env.local
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      # Build a separate deterministic mock bundle: public env values are
      # embedded by Next.js at build time and cannot be swapped at `next start`.
      - run: npm run build:e2e
      - run: npm run test:e2e:production

  indexer:
    needs: solidity
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: indexer
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: indexer/package-lock.json
      - name: Import ABI compiled by the Solidity job
        uses: actions/download-artifact@v8
        with:
          name: hwa-fwa-abi-${{ github.sha }}
          path: out/FWA.sol
      - run: npm ci
      # The indexer has no runtime npm dependencies. graph-cli and graph-ts are
      # build-only tools, so this mirrors the release gate's shipped-dependency audit.
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run check
