limit_req_zone $binary_remote_addr zone=hwa_api:10m rate=30r/s;

server {
    listen 80;
    listen [::]:80;
    server_name hwa.fun assets.hwa.fun;
    return 301 https://$host$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name www.hwa.fun;
    return 301 https://hwa.fun$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.hwa.fun;

    ssl_certificate /etc/letsencrypt/live/hwa.fun/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hwa.fun/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://hwa.fun$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name hwa.fun;

    ssl_certificate /etc/letsencrypt/live/hwa.fun/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hwa.fun/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 1m;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;

    location ~ ^/api/(rpc/logs|nft-metadata) {
        limit_req zone=hwa_api burst=60 nodelay;
        proxy_pass http://127.0.0.1:3900;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 30s;
    }

    location / {
        proxy_pass http://127.0.0.1:3900;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 60s;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name assets.hwa.fun;

    ssl_certificate /etc/letsencrypt/live/hwa.fun/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hwa.fun/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /srv/hwa-genesis/public;
    autoindex off;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

    location ~ "^/hwa-genesis/v3/96b80e5c8a06b07407d92b58dbf7865aab242439bdfdb5d8436e370cd2915648/metadata/(?:[1-9]|[1-9][0-9]|[1-2][0-9]{2}|3[0-2][0-9]|33[0-3])$" {
        default_type application/json;
        try_files $uri =404;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
        limit_except GET HEAD { deny all; }
    }

    location ^~ /hwa-genesis/v3/96b80e5c8a06b07407d92b58dbf7865aab242439bdfdb5d8436e370cd2915648/images/ {
        types { image/svg+xml svg; }
        default_type application/octet-stream;
        try_files $uri =404;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
        limit_except GET HEAD { deny all; }
    }

    location = /hwa-genesis/v3/96b80e5c8a06b07407d92b58dbf7865aab242439bdfdb5d8436e370cd2915648/deployment-manifest.json {
        default_type application/json;
        try_files $uri =404;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
        limit_except GET HEAD { deny all; }
    }

    location / { return 404; }
}
